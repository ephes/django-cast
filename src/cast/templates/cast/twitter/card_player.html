{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <div id="pwp5-{{ episode.uuid }}" data-twitter-player style="width:200px">
      <root style="max-width:250px;min-width:250px;" class="p-4 flex justify-left ">
        <play-button></play-button>
      </root>

    </div>

  </body>

  <script type="text/javascript" src="{% static 'cast/js/web-player/embed.5.js' %}"></script>
  {{ player_config|json_script:"twitter-player-config" }}
  <script>
    (function () {
      var config = JSON.parse(document.getElementById("twitter-player-config").textContent);
      podlovePlayer("[data-twitter-player]", config, {
        "version": 5,
        "theme": {
          "tokens": {
            "brandLightest": "#3c6f97",
            "contrast":  "#fff",
            "brandDark":  "#fff",
            "brand": "#fff",
          }
        },
      });
    })();
  </script>
</html>
