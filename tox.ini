[tox]
envlist =
    py{311,312,313}-django52-wagtail{70,7latest}
    py314-django52-wagtail{7latest,80}
    py{312,313,314}-django60-wagtail{7latest,80}
    py{312,313,314}-django61-wagtail{7latest,80}
    migrations-{oldest,latest}

isolated_build = true

[testenv]
package = wheel
wheel_build_env = .pkg
runner = uv-venv-runner
constrain_package_deps = true
deps =
    django52: Django>=5.2,<6
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<7
    wagtail70: wagtail>=7.0,<7.1
    wagtail7latest: wagtail>=7.4,<8
    wagtail80: wagtail>=8.0,<8.1
    pytest >= 6
    pytest-django
    pytest-mock
    pytest-randomly
    pytz
    factory_boy
    feedparser

setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
    PYTHONPATH={toxinidir}/src
    CAST_TEST_DB={toxworkdir}/{envname}-test_database.sqlite3
    CAST_TEST_MEDIA_ROOT={toxworkdir}/{envname}-media
    CAST_TEST_PRIVATE_MEDIA_ROOT={toxworkdir}/{envname}-private-media
    TERM=xterm-256color
commands =
    python -m pytest -q

[testenv:fast]
# Quick test environment for development
package = wheel
wheel_build_env = .pkg
runner = uv-venv-runner
deps =
    {[testenv]deps}
    Django>=6.0,<7
    wagtail>=7.0,<9
setenv =
    {[testenv]setenv}
commands =
    python -m pytest -q --tb=short

[testenv:migrations-{oldest,latest}]
# The test suite runs with --no-migrations, so it builds its database straight
# from the models and never applies a single migration. These envs are the only
# place a migration graph that does not apply cleanly gets caught - each starts
# from an empty database in {envtmpdir}, which tox wipes on every run. The
# oldest and latest supported dependency combinations bound the matrix.
package = wheel
wheel_build_env = .pkg
runner = uv-venv-runner
basepython =
    oldest: python3.11
    latest: python3.13
deps =
    {[testenv]deps}
    oldest: Django>=5.2,<6
    oldest: wagtail>=7.0,<7.1
    latest: Django>=6.1,<7
    latest: wagtail>=8.0,<9
setenv =
    {[testenv]setenv}
    CAST_TEST_DB={envtmpdir}/migration-check.sqlite3
commands =
    python manage.py migrate --noinput

[testenv:cleanup]
skip_install = true
isolated_build = false
deps =
commands =
    # tox executes commands without a shell, so globs must be expanded in python
    python -c "import glob, os; [os.remove(path) for pattern in ('tests/test_database.sqlite3*', r'{toxworkdir}/*-test_database.sqlite3*', r'{toxworkdir}/migrations-*/tmp/migration-check.sqlite3*') for path in glob.glob(pattern)]"
    python -c "import glob, shutil; [shutil.rmtree(path, ignore_errors=True) for pattern in (r'{toxworkdir}/*-media', r'{toxworkdir}/*-private-media') for path in glob.glob(pattern)]"
    python -c "print('All tests done!')"

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files
