# Vendored (htmx.min.js) and vite-generated bundles are excluded so hooks don't
# introduce churn against upstream releases and `vite build` output.
exclude: "^.*(migrations|fluent_comments).*$|^src/cast/static/cast/(vite/|js/.*\\.min\\.js)"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.31.1
    hooks:
      - id: django-upgrade
        args: [--target-version, "5.2"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/rtts/djhtml
    rev: "3.0.11"  # replace with the latest tag on GitHub
    hooks:
      - id: djhtml
        args: [-t, "2"]
